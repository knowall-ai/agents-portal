# Curriculum for the agent-training harness (knowall-ai/agent-training#14)
scenarios:
  - id: smoke
    title: Smoke test
    agents: [sallie, poppie]
    cadence: weekly
    note: >-
      Six short questions, about two minutes. The one to run after every
      deploy of the agent or the bridge.
  - id: lag-repro
    title: 'Lag reproduction'
    agents:
      - sallie
    cadence: monthly # re-run monthly
  - id: induction-quiz
    title: Induction quiz
    agents: [sallie]
    cadence: once
    requires: enrolled voice profiles
    note: |
      The full induction: 23 asks.
      # not a comment
      About ten minutes.
  - id: meeting-prep
    title: Meeting prep
    agents: [poppie]
    cadence: on-change
