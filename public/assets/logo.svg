<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100">
  <defs>
    <linearGradient id="metalGradientFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="shineGradientFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Icon background -->
  <rect x="10" y="20" width="60" height="60" rx="8" ry="8" fill="url(#metalGradientFull)" />
  <rect x="10" y="20" width="60" height="60" rx="8" ry="8" fill="url(#shineGradientFull)" />

  <!-- Heartbeat pulse line (scaled for 60x60 icon at 10,20) -->
  <polyline points="18.4,51.9 27.8,51.9 33.4,36.9 40.9,65 47.5,44.4 52.2,51.9 61.6,51.9" fill="none" stroke="#ffffff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "Agent Dashboard" wordmark with two-tone coloring -->
  <text x="85" y="55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="700">
    <tspan fill="#22c55e">Agent</tspan><tspan fill="#f3f4f6">&#160;Dashboard</tspan>
  </text>

  <!-- Tagline -->
  <text x="85" y="78" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#9ca3af">AI Agent Monitoring Across Azure Tenants</text>
</svg>
