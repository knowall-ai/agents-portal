name: Deploy to Production

on:
  # Deploy when a release tag is created (bun pm version → git push --follow-tags)
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  AZURE_WEBAPP_NAME: agent-dashboard-knowallai
  APP_URL: https://agents.knowall.ai
  # Smoke test the App Service host directly so the check does not depend on DNS
  SMOKE_URL: https://agent-dashboard-knowallai.azurewebsites.net
  BUN_VERSION: 'latest'

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://agents.knowall.ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Build application
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXTAUTH_URL: ${{ env.APP_URL }}
          APP_URL: ${{ env.APP_URL }}

      - name: Prepare standalone deployment
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          echo "Standalone deployment package prepared"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Runtime settings (NEXTAUTH_SECRET, AZURE_AD_*, GITHUB_TOKEN) are managed
      # in App Service configuration, not here — see docs/DEPLOYMENT.adoc.
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .next/standalone
          startup-command: 'node server.js'

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${SMOKE_URL}/api/health" | grep -q '"status":"ok"'; then
              echo "Health check passed"; exit 0
            fi
            sleep 10
          done
          echo "Health check failed"; exit 1
